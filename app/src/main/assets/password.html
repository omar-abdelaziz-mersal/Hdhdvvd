<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال الرقم السري</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', 'Roboto', 'Tahoma', 'Arial', sans-serif;
        }
        
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .pin-card {
            background-color: #fbfbfb;
            width: 100%;
            max-width: 420px;
            border-radius: 0; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden; 
        }

        .card-content {
            padding: 30px 25px 20px;
        }

        .title {
            text-align: right;
            font-size: 19px;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .transfer-info {
            text-align: right;
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .pin-inputs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            direction: ltr; 
        }

        .pin-inputs input {
            width: 50px;
            height: 60px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            font-size: 26px;
            color: #333;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .pin-inputs input:focus {
            border-color: #666;
        }

        .forgot-password {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 30px;
            cursor: pointer;
        }

        .forgot-password span {
            color: #666;
            font-size: 15px;
            margin-left: 10px;
            font-weight: 600;
        }

        .help-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 22px;
            height: 22px;
            background-color: #444;
            border-radius: 50%;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }

        .footer-banner {
            background-color: #2b2b2b;
            color: #ffffff;
            text-align: center;
            padding: 18px;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="pin-card">
        <div class="card-content">
            <h3 class="title">ادخل رقمك السري</h3>
            
            <div id="infoText" class="transfer-info"></div>
            
            <div class="pin-inputs">
                <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            </div>

            <div class="forgot-password">
                <div class="help-icon">?</div>
                <span>نسيت الرقم السري؟</span>
            </div>
        </div>

        <div class="footer-banner">
            ادخل الرقم السري المكون من 6 ارقام
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const phone = params.get('phone');
        const amount = params.get('amount');
        
        if (phone && amount) {
            document.getElementById('infoText').innerHTML = 'سيتم تحويل <strong>' + amount + ' ج.م</strong> <br> إلى الرقم: <strong>' + phone + '</strong>';
        }

        const inputs = document.querySelectorAll('.pin-box');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (input.value.length > 0) {
                    const realChar = input.value.slice(-1);
                    if (/[0-9]/.test(realChar)) {
                        input.dataset.realValue = realChar;
                        input.value = '*';
                    } else {
                        input.value = input.dataset.realValue ? '*' : '';
                    }
                } else {
                    input.dataset.realValue = '';
                }

                if(input.dataset.realValue && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                let allFilled = true;
                inputs.forEach(inp => { 
                    if(!inp.dataset.realValue) allFilled = false; 
                });
                
                if(allFilled) {
                    window.location.href = 'loading.html?phone=' + phone + '&amount=' + amount;
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (input.dataset.realValue) {
                        input.dataset.realValue = '';
                        input.value = '';
                    } else if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].dataset.realValue = '';
                        inputs[index - 1].value = '';
                    }
                }
            });
        });
    </script>
</body>
</html>
